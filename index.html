<!DOCTYPE html>
<html lang="id">

            sans: ['"Segoe UI"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            msblue: {
              50: '#eff6fc',
              100: '#deecf9',
              200: '#c7e0f4',
              500: '#0078D4',
              600: '#106ebe',
              700: '#005a9e',
              900: '#0b2545',
            }
          }
        }
      }

</head>
<body class="bg-[#F3F2F1] text-slate-800 font-sans antialiased selection:bg-msblue-100 selection:text-msblue-700 min-h-screen flex flex-col">

       ===================================================================== -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/90 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <!-- Top Row: Brand, Master Badge & Segmented Language Toggle -->
      <div class="py-3.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-3">
          <!-- Microsoft Fluent-inspired App Icon -->
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0078D4] via-[#106ebe] to-[#005a9e] text-white flex items-center justify-center shadow-sm shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h1 id="header-title" class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900 leading-tight">
                MS Partner Funding Navigator
              </h1>
              <span id="header-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-msblue-50 text-[#0078D4] border border-msblue-200">
                Master Edition • 28 Program
              </span>
            </div>
            <p id="header-subtitle" class="text-xs text-slate-500 mt-0.5">
              Panduan All-in-One Funding, Migrasi, Rebate, PAL, ISV &amp; Co-op Microsoft Partner
            </p>
          </div>
        </div>

        <!-- Right Controls: Segmented Bilingual Toggle [ ID | EN ] -->
        <div class="flex items-center justify-between sm:justify-end gap-2.5">
          <div class="inline-flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/90 shadow-inner" role="group" aria-label="Language Toggle">
            <button
              id="lang-btn-id"
              onclick="setLanguage('id')"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5"
              aria-pressed="true"
            >
              <span>🇮🇩</span>
              <span>ID</span>
            </button>
            <button
              id="lang-btn-en"
              onclick="setLanguage('en')"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5"
              aria-pressed="false"
            >
              <span>🇬🇧</span>
              <span>EN</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 5 Main Navigation Tabs (Horizontally scrollable on small screens) -->
      <nav class="flex items-center gap-1 overflow-x-auto pb-0 -mb-px" aria-label="Main Navigation">
        <button id="tab-btn-catalog" onclick="switchTab('catalog')" class="tab-btn shrink-0 px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap inline-flex items-center gap-1.5">
          <span id="nav-label-catalog">1. Katalog Master</span>
          <span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-msblue-100 text-[#0078D4]">28</span>
        </button>
        <button id="tab-btn-finder" onclick="switchTab('finder')" class="tab-btn shrink-0 px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap inline-flex items-center gap-1.5">
          <span id="nav-label-finder">2. Funding Finder</span>
        </button>
        <button id="tab-btn-claim" onclick="switchTab('claim')" class="tab-btn shrink-0 px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap inline-flex items-center gap-1.5">
          <span id="nav-label-claim">3. Alur Klaim &amp; PoE</span>
          <span id="nav-poe-badge" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-teal-50 text-teal-700 border border-teal-200">0/8</span>
        </button>
        <button id="tab-btn-scripts" onclick="switchTab('scripts')" class="tab-btn shrink-0 px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap inline-flex items-center gap-1.5">
          <span id="nav-label-scripts">4. Skrip Pitching &amp; Email AE</span>
        </button>
        <button id="tab-btn-references" onclick="switchTab('references')" class="tab-btn shrink-0 px-3.5 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap inline-flex items-center gap-1.5">
          <span id="nav-label-references">5. Referensi &amp; Verifikasi</span>
          <span id="nav-ref-badge" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">Resmi</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- =====================================================================
       MAIN CONTENT AREA
       ===================================================================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Transparency Disclaimer Banner -->
    <div id="disclaimer-banner" class="bg-amber-50/95 border border-amber-200/90 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs sm:text-sm text-amber-950 shadow-xs">
      <!-- Rendered dynamically by JS -->
    </div>

    <!-- ===================================================================
         TAB 1: MASTER CATALOG (28 PROGRAMS ALL-IN-ONE)
         =================================================================== -->
    <section id="tab-catalog" class="space-y-5">
      <!-- Hero + Search + Favorites Only Toggle + Category Filter Pills -->
      <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm space-y-5">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div id="catalog-hero-text">
            <!-- Rendered by JS -->
          </div>

          <!-- Search + Favorites Toggle -->
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full lg:w-auto shrink-0">
            <div class="relative flex-1 sm:w-72">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </div>
              <input
                id="catalog-search"
                type="text"
                placeholder="Cari: Azure, Fabric, Copilot, PAL, ISV..."
                class="w-full pl-10 pr-9 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0078D4]/30 focus:border-[#0078D4] transition-all placeholder:text-slate-400"
              />
              <button
                id="catalog-clear-search"
                onclick="clearCatalogSearch()"
                class="hidden absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600"
                aria-label="Clear search"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Favorites Only Toggle Button -->
            <button
              id="fav-only-btn"
              onclick="toggleFavoritesOnly()"
              class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl border text-xs font-bold transition-all shrink-0"
            >
              <!-- Rendered by JS -->
            </button>
          </div>
        </div>

        <!-- Category Filter Pills -->
        <div id="catalog-filters" class="flex flex-wrap gap-2 pt-4 border-t border-slate-100">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Result Count & Legend -->
      <div id="catalog-meta-bar" class="flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm text-slate-500 px-1">
        <!-- Rendered by JS -->
      </div>

      <!-- 28 Program Cards Grid -->
      <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ===================================================================
         TAB 2: FUNDING FINDER (INTERACTIVE WIZARD)
         =================================================================== -->
    <section id="tab-finder" class="hidden space-y-6">
      <div id="finder-hero" class="bg-gradient-to-br from-[#0078D4] via-[#005a9e] to-slate-900 text-white rounded-2xl p-5 sm:p-6 shadow-md">
        <!-- Rendered by JS -->
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm space-y-3">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#0078D4] text-white text-xs font-bold flex items-center justify-center">1</span>
            <h3 id="wizard-step1-title" class="text-sm font-bold text-slate-900">Fokus Skenario</h3>
          </div>
          <div id="wizard-focus-options" class="grid grid-cols-1 gap-2"></div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm space-y-3">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-teal-600 text-white text-xs font-bold flex items-center justify-center">2</span>
            <h3 id="wizard-step2-title" class="text-sm font-bold text-slate-900">Tahap Kesiapan Klien</h3>
          </div>
          <div id="wizard-stage-options" class="grid grid-cols-1 gap-2"></div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm space-y-3">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">3</span>
            <h3 id="wizard-step3-title" class="text-sm font-bold text-slate-900">Skala Klien</h3>
          </div>
          <div id="wizard-scale-options" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>

      <!-- Wizard Output -->
      <div id="wizard-results" class="space-y-4"></div>
    </section>

    <!-- ===================================================================
         TAB 3: CLAIM WORKFLOW & PoE CHECKLIST
         =================================================================== -->
    <section id="tab-claim" class="hidden space-y-6">
      <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm space-y-5">
        <div id="claim-steps-header"></div>
        <div id="claim-steps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm space-y-5">
        <div id="poe-header-row" class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"></div>

        <!-- Progress Bar -->
        <div class="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200/70">
          <div class="flex items-center justify-between text-xs sm:text-sm font-bold">
            <span id="poe-progress-label" class="text-slate-800"></span>
            <span id="poe-status-pill" class="px-2.5 py-0.5 rounded-full text-xs"></span>
          </div>
          <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
            <div id="poe-progress-bar" class="h-full bg-gradient-to-r from-[#0078D4] to-teal-500 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div id="poe-checklist-container" class="space-y-2.5"></div>

    </section>

         TAB 4: PITCHING SCRIPTS & AE EMAIL TEMPLATES (5 TEMPLATES)
         =================================================================== -->
    <section id="tab-scripts" class="hidden space-y-6">
      <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm space-y-4">
        <div id="scripts-header"></div>

        <!-- 4 Live Personalization Inputs -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-3 border-t border-slate-100">
          <div>

          </div>
          <div>
            <label id="lbl-tpl-topic" for="tpl-topic" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1"></label>
            <input id="tpl-topic" type="text" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0078D4]/30 focus:border-[#0078D4]" />
          </div>
          <div>
            <label id="lbl-tpl-ae" for="tpl-ae-name" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1"></label>

          </div>
          <div>
            <label id="lbl-tpl-partner" for="tpl-partner-name" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1"></label>
            <input id="tpl-partner-name" type="text" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0078D4]/30 focus:border-[#0078D4]" />
          </div>
        </div>
      </div>

      <div id="scripts-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
    </section>

    <!-- ===================================================================
         TAB 5: REFERENCES & VERIFICATION
         =================================================================== -->
    <section id="tab-references" class="hidden space-y-6">
      <div id="ref-hero" class="bg-gradient-to-br from-[#0078D4] via-[#005a9e] to-slate-900 text-white rounded-2xl p-5 sm:p-6 shadow-md"></div>

      <div class="space-y-4">
        <div id="ref-links-header" class="flex items-center justify-between"></div>
        <div id="references-links-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <div id="ref-verification-box" class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 shadow-sm space-y-5"></div>
    </section>

  </main>

  <!-- =====================================================================
       DETAIL MODAL FOR ANY OF THE 28 PROGRAMS
       ===================================================================== -->
  <div
    id="program-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
    role="dialog"
    aria-modal="true"
    onclick="handleModalBackdropClick(event)"
  >
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 flex flex-col">
      <div class="sticky top-0 bg-white/95 backdrop-blur-sm px-6 py-4 border-b border-slate-200 flex items-start justify-between gap-4 z-10">
        <div>
          <div id="modal-badges" class="flex flex-wrap items-center gap-1.5 mb-1.5"></div>
          <h3 id="modal-title" class="text-lg sm:text-xl font-extrabold text-slate-900 leading-snug"></h3>
        </div>
        <button
          onclick="closeProgramModal()"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors shrink-0"
          aria-label="Close modal"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="modal-body" class="p-6 space-y-5 text-sm"></div>

      <div id="modal-footer" class="sticky bottom-0 bg-slate-50 px-6 py-3.5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2"></div>
    </div>
  </div>

  <!-- =====================================================================
       FOOTER
       ===================================================================== -->
  <footer class="border-t border-slate-200 bg-white mt-12">
    <div id="footer-content" class="max-w-6xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500"></div>
  </footer>

  <!-- Toast Notification Container (No alert() used) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    function loadStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw !== null ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        // Ignore quota errors
      }
    }

    let state = {
      lang: loadStorage(STORAGE_KEYS.LANG, 'id'),

      catalogSearch: '',

      wizard: {
        focus: 'migration',
        stage: 'assessment_poc',
        scale: 'enterprise'
      },
      checkedPoe: loadStorage(STORAGE_KEYS.POE, []),

        aeName: '',
        partnerName: ''

      activeModalProgramId: null
    };

    /**
     * =========================================================================
     * 8. UTILITIES (ESCAPE, CLIPBOARD, TOAST, LANGUAGE SWITCHER)
     * =========================================================================
     */
    function t() {
      return UI_TEXT[state.lang] || UI_TEXT.id;
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function copyToClipboard(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || t().scripts.copiedToast, 'success');
        } else {
          showToast(t().scripts.copyFailToast, 'error');
        }
      } catch (err) {
        showToast(t().scripts.copyFailToast, 'error');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
      toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl shadow-lg text-sm font-semibold text-white transition-all duration-300 translate-y-2 opacity-0 ${bg}`;
      toast.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>${escapeHTML(message)}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    function setLanguage(lang) {
      if (lang !== 'id' && lang !== 'en') return;
      state.lang = lang;
      saveStorage(STORAGE_KEYS.LANG, lang);
      document.documentElement.lang = lang;
      renderAll();
      if (state.activeModalProgramId) {
        openProgramModal(state.activeModalProgramId, true);

      showToast(t().langToast, 'success');

    function getCategoryStyle(catId) {
      switch (catId) {
        case 'migration': return 'bg-sky-50 text-sky-800 border-sky-200';
        case 'data_ai': return 'bg-teal-50 text-teal-800 border-teal-200';
        case 'sec_mw_biz': return 'bg-indigo-50 text-indigo-800 border-indigo-200';
        case 'tactical': return 'bg-amber-50 text-amber-900 border-amber-200';
        case 'rebates': return 'bg-emerald-50 text-emerald-800 border-emerald-200';
        case 'isv_mkt': return 'bg-violet-50 text-violet-800 border-violet-200';
        default: return 'bg-slate-100 text-slate-700 border-slate-200';
      }
    }

    function getCategoryShortName(catId) {
      const map = {
        migration: { id: 'Migrasi & Modernisasi', en: 'Migration & Modernization' },
        data_ai: { id: 'Data, AI & Copilot', en: 'Data, AI & Copilot' },
        sec_mw_biz: { id: 'Security, MW & BizApps', en: 'Security, MW & BizApps' },
        tactical: { id: 'Dana Taktis & Credits', en: 'Tactical & PoC Credits' },
        rebates: { id: 'Rebate, PAL & CPOR', en: 'Rebates, PAL & CPOR' },
        isv_mkt: { id: 'ISV, Marketing & Benefits', en: 'ISV, Marketing & Benefits' }
      };
      return map[catId] ? map[catId][state.lang] : catId;
    }

    function getRecipientLabel(recipient) {
      if (recipient === 'client') {
        return state.lang === 'id' ? 'Ke Klien (Kredit/Layanan)' : 'To Client (Credit/Service)';

      return state.lang === 'id' ? 'Ke Partner' : 'To Partner';

      if (event) event.stopPropagation();

        showToast(t().catalog.removeFavToast, 'success');
      } else {
        state.favorites.push(programId);

      renderCatalog();

    function computeWizardRecommendations() {
      const { focus, stage, scale } = state.wizard;
      const lang = state.lang;

      const scored = FUNDING_PROGRAMS.map(p => {
        let score = 0;
        const reasons = [];

        if (p.wizardMeta.focus.includes(focus)) {
          score += 6;
          reasons.push(lang === 'id' ? 'Sesuai langsung dengan fokus skenario klien' : 'Directly matches the selected client focus scenario');
        }
        if (p.wizardMeta.stages.includes(stage)) {
          score += 4;
          reasons.push(lang === 'id' ? 'Cocok dengan tahap kesiapan proyek saat ini' : 'Aligned with the client\'s current readiness stage');
        }
        if (p.wizardMeta.scales.includes(scale)) {
          score += 2;
          reasons.push(lang === 'id' ? 'Sesuai dengan skala perusahaan klien' : 'Fits the target organization scale');
        }

        // Targeted boosts
        if (focus === 'marketing' && (p.id === 'mkt-coop-funds' || p.id === 'mkt-mdf-iur-ft')) score += 6;
        if (focus === 'isv_app' && (p.id === 'isv-success' || p.id === 'isv-marketplace-rewards')) score += 6;
        if (focus === 'managed_rebate' && p.category === 'rebates') score += 5;
        if (stage === 'assessment_poc' && p.id === 'tac-sponsorship' && focus !== 'marketing' && focus !== 'isv_app') {
          score += 3;
          reasons.push(lang === 'id' ? 'Menutup biaya konsumsi cloud PoC klien menjadi $0' : 'Covers client PoC cloud consumption costs ($0 cloud bill)');
        }

        return { program: p, score, reasons };
      });

      return scored
        .filter(item => item.score >= 8)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4);
    }

Sebagai bagian dari standar kolaborasi kami di ${partner} sebagai Microsoft Solutions Partner untuk proyek ${topic}, kami mohon izin untuk menautkan Partner Admin Link (PAL) pada akun teknis tim kami yang bekerja di subscription Azure Bapak/Ibu.

Sebagai informasi transparan:
1. PAL TIDAK memberikan tambahan hak akses apa pun—tim kami tetap hanya memiliki izin RBAC sesuai yang Bapak/Ibu berikan.
2. Tidak ada biaya tambahan sama sekali bagi perusahaan Bapak/Ibu.
3. Dengan PAL aktif, Microsoft mencatat keterlibatan resmi kami sehingga memudahkan kami membantu Bapak/Ibu mengakses program subsidi lanjutan (Azure Accelerate, ECIF, maupun dukungan teknis eskalasi Microsoft).

Proses penautannya hanya butuh waktu 2 menit. Apakah Bapak/Ibu berkenan jika kami jadwalkan bersama tim Cloud Admin saat kick-off nanti?`
          },
          {
            id: 'tpl-5',
            badge: 'License Waste & UU PDP',
            badgeClass: 'bg-teal-50 text-teal-800 border-teal-200',
            title: '5. Pitching Optimalisasi Lisensi M365 E3/E5 & Kepatuhan UU PDP',
            tip: 'Sangat ampuh karena klien tidak perlu keluar budget lisensi baru—cukup mengaktifkan fitur keamanan & Purview yang sudah mereka bayar.',
            content: `Halo ${client},

Dari pengalaman kami di ${partner} mendampingi banyak perusahaan di Indonesia, lebih dari 70% organisasi yang sudah membayar lisensi Microsoft 365 E3/E5 ternyata baru memanfaatkan kurang dari 30% fitur keamanannya (seperti Entra ID, Defender, dan Microsoft Purview)—padahal fitur tersebut sangat krusial untuk kesiapan UU PDP dan keamanan sebelum adopsi AI.

Kami ingin menawarkan sesi singkat "License Feature & Security Optimization Review" untuk membantu tim Bapak/Ibu:
• Memetakan fitur keamanan & compliance apa saja yang sebenarnya sudah Bapak/Ibu bayar tapi belum aktif.
• Mengidentifikasi potensi penghematan biaya dari tools keamanan pihak ketiga yang tumpang tindih.
• Menyiapkan langkah cepat perlindungan data pribadi (DLP & Sensitivity Labels) sesuai UU PDP.

Kabar baiknya, sesi asesmen ini berpotensi kami ajukan lewat subsidi resmi Microsoft (MCI Security Engagement). Apakah kita bisa jadwalkan obrolan 15 menit minggu depan?`
          }
        ];
      }

      // ENGLISH VERSION (PROFESSIONAL GLOBAL / REGIONAL STANDARD)
      return [
        {
          id: 'tpl-1',
          badge: 'Client Pitch',
          badgeClass: 'bg-msblue-50 text-[#0078D4] border-msblue-200',
          title: '1. Pitching Migration / Assessment Subsidy to Client',
          tip: 'Avoid words like "freebie" or "promo". Frame it as a "Microsoft co-investment allocation" to preserve high consulting value.',
          content: `Hi ${client},

Given your team's focus this year on ${topic}, ${partner}—as a certified Microsoft Solutions Partner—currently holds a limited Microsoft co-investment allocation (Azure Accelerate / MCI) for this quarter.

Through this program, Microsoft subsidizes the consulting effort for an Assessment & PoC engagement so your team receives:
1. An objective technical architecture, TCO analysis, and readiness assessment.
2. A scoped PoC tailored to a real business use case in your environment.
3. An executive-ready roadmap and business case for leadership sign-off.

The requirement is straightforward: a quick confirmation on Microsoft's official nomination email and 1–2 working sessions with your key stakeholders.

If this aligns with your priorities, I can verify your tenant's eligibility this week. Would you be open to a quick 15-minute call?`
        },
        {
          id: 'tpl-2',
          badge: 'Objection Handling',
          badgeClass: 'bg-amber-50 text-amber-900 border-amber-200',
          title: '2. Handling Client Objection ("Is There a Catch or Hidden Fee?")',
          tip: 'Respond calmly and transparently. Explaining Microsoft\'s clear business logic builds immediate executive trust.',
          content: `"That is a completely fair question—and candidly, there is no catch, hidden fee, or binding purchase obligation whatsoever.

Microsoft's business rationale is simple: they know many enterprises want to pursue ${topic}, yet hesitate because they lack technical proof or worry about getting the architecture wrong.

That is why Microsoft co-invests in certified partners like ${partner} to guide you properly through the initial assessment and PoC. Their hope is that once you see tangible value, you will feel confident scaling on the platform long term.

If you complete the assessment and decide to pause or not move forward, that is 100% your decision with zero penalties."`
        },
        {
          id: 'tpl-3',
          badge: 'Microsoft AE Email',
          badgeClass: 'bg-indigo-50 text-indigo-800 border-indigo-200',
          title: '3. Email Requesting ECIF / Azure Accelerate Funding to Microsoft AE',
          tip: 'Microsoft AEs are measured on ACR and seat growth. Always highlight projected consumption/license impact for faster approval.',
          content: `Subject: Funding Alignment & ECIF Nomination Request — ${client} (${topic})

Hi ${ae}, hope you are having a great week!

I am reaching out from ${partner} to align on an active opportunity we are developing at ${client} around ${topic}.

Opportunity Summary:
• Client Objective: Structured Assessment / PoC to accelerate production rollout for ${topic}.
• Current Blocker: Client leadership requires technical validation and a clear business case before approving full project budget.
• Projected Impact: [Insert estimated Year-1 ACR or new M365/Copilot seat expansion].

To de-risk and accelerate their decision, we would like to request [ECIF / Azure Accelerate / Azure Sponsorship Credits]. Our draft Statement of Work (SOW) and delivery timeline are ready.

Could we grab 10–15 minutes this week to check funding availability and align with your account plan?

Thank you for your partnership!
Best regards,
[Your Name & Title] — ${partner}`
        },
        {
          id: 'tpl-4',
          badge: 'Enterprise Agreement (EA) Client',
          badgeClass: 'bg-emerald-50 text-emerald-800 border-emerald-200',
          title: '4. Pitching PAL (Partner Admin Link) to EA Clients',
          tip: 'EA clients often worry about security permissions. Clarify upfront that PAL is purely attribution metadata and grants zero extra access.',
          content: `Hi ${client},

As part of ${partner}'s standard governance as a Microsoft Solutions Partner delivering ${topic}, we kindly request permission to associate our Partner Admin Link (PAL) with our engineering account operating inside your Azure subscription.

For complete transparency:
1. PAL grants ZERO additional access or permissions—our team remains strictly bounded by the exact RBAC roles your IT team assigns.
2. There is no cost or billing change to your Enterprise Agreement.
3. Active PAL attribution formally recognizes our partnership with Microsoft, enabling us to help unlock future co-investment programs (Azure Accelerate, ECIF) and faster technical escalation support for your team.

The setup takes under 2 minutes. Would it be alright if we complete this alongside your Cloud Admin during project kick-off?`
        },
        {
          id: 'tpl-5',
          badge: 'License Optimization & Privacy',
          badgeClass: 'bg-teal-50 text-teal-800 border-teal-200',
          title: '5. Pitching E3/E5 License Optimization & Data Privacy Compliance',
          tip: 'High-impact pitch because clients do not need new license spend—they unlock security and Purview compliance they already pay for.',
          content: `Hi ${client},

In our work at ${partner}, we consistently see over 70% of organizations paying for Microsoft 365 E3/E5 utilizing less than 30% of their built-in security and compliance capabilities (Entra ID, Defender XDR, Microsoft Purview)—even though these tools are vital for data privacy compliance (UU PDP / GDPR) and safe AI readiness.

Best of all, this assessment may qualify for official Microsoft co-investment (MCI Security Engagement). Would you have 15 minutes next week to explore this?`
        }
      ];
    }

    function renderScriptsTab() {
      const ui = t().scripts;

      document.getElementById('scripts-header').innerHTML = `
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-msblue-50 text-[#0078D4] border border-msblue-200 mb-2">
          ${escapeHTML(ui.pill)}
        </span>
        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHTML(ui.title)}</h2>
        <p class="text-sm text-slate-600 mt-1">${escapeHTML(ui.desc)}</p>
      `;

      document.getElementById('lbl-tpl-client').textContent = ui.lblClient;
      document.getElementById('tpl-client-name').placeholder = ui.phClient;
      document.getElementById('lbl-tpl-topic').textContent = ui.lblTopic;
      document.getElementById('tpl-topic').placeholder = ui.phTopic;
      document.getElementById('lbl-tpl-ae').textContent = ui.lblAe;
      document.getElementById('tpl-ae-name').placeholder = ui.phAe;
      document.getElementById('lbl-tpl-partner').textContent = ui.lblPartner;
      document.getElementById('tpl-partner-name').placeholder = ui.phPartner;

      const scripts = getGeneratedScripts();
      document.getElementById('scripts-grid').innerHTML = scripts.map((s, idx) => `
        <article class="bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm flex flex-col justify-between gap-4 ${idx === 4 ? 'lg:col-span-2' : ''}">
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${s.badgeClass} mb-1.5">
                  ${escapeHTML(s.badge)}
                </span>
                <h3 class="text-base font-bold text-slate-900 leading-snug">${escapeHTML(s.title)}</h3>
              </div>
              <button
                onclick="copyScriptById('${s.id}')"
                class="shrink-0 inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-msblue-50 hover:bg-[#0078D4] text-[#0078D4] hover:text-white text-xs font-bold transition-colors border border-msblue-200/80"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span>${escapeHTML(ui.copyBtn)}</span>
              </button>
            </div>

            <pre class="whitespace-pre-wrap font-sans text-xs sm:text-[13px] text-slate-800 leading-relaxed bg-[#F8FAFC] border border-slate-200/80 rounded-xl p-4">${escapeHTML(s.content)}</pre>
          </div>

          <div class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3 border border-slate-100">
            <strong class="text-slate-800">${escapeHTML(ui.tipLabel)}</strong> ${escapeHTML(s.tip)}
          </div>
        </article>
      `).join('');
    }

    function copyScriptById(scriptId) {
      const found = getGeneratedScripts().find(s => s.id === scriptId);
      if (!found) return;
      copyToClipboard(found.content, t().scripts.copiedToast);
    }

    /**
     * =========================================================================
     * 14. TAB 5: REFERENCES & VERIFICATION (BILINGUAL)
     * =========================================================================
     */

      const ui = t().references;
      const lang = state.lang;

      document.getElementById('ref-hero').innerHTML = `
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-white/15 text-blue-100 border border-white/25 mb-2">
          ${escapeHTML(ui.pill)}
        </span>
        <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">${escapeHTML(ui.title)}</h2>
        <p class="text-sm text-blue-100/90 mt-1 max-w-2xl leading-relaxed">${escapeHTML(ui.desc)}</p>

      document.getElementById('ref-links-header').innerHTML = `
        <h3 class="text-lg font-extrabold text-slate-900">${escapeHTML(ui.dirTitle)}</h3>
        <span class="text-xs font-semibold text-slate-500">${escapeHTML(ui.openNewTab)}</span>
      `;

      document.getElementById('references-links-grid').innerHTML = OFFICIAL_REFERENCES.map(ref => `
        <a
          href="${escapeHTML(ref.url)}"
          target="_blank"
          rel="noopener noreferrer"
          class="group bg-white rounded-2xl border border-slate-200/90 hover:border-[#0078D4] hover:shadow-md p-5 shadow-xs transition-all flex flex-col justify-between gap-3"

          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${ref.badgeClass}">
                ${escapeHTML(ref.category[lang])}
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 group-hover:text-[#0078D4] transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </div>
            <h4 class="text-sm sm:text-base font-bold text-slate-900 group-hover:text-[#0078D4] transition-colors leading-snug">
              ${escapeHTML(ref.title)}
            </h4>
            <p class="text-xs sm:text-[13px] text-slate-600 leading-relaxed">
              ${escapeHTML(ref.desc[lang])}
            </p>
          </div>
          <div class="text-[11px] font-mono text-slate-400 group-hover:text-[#0078D4] truncate pt-2 border-t border-slate-100">
            ${escapeHTML(ref.url)}
          </div>
        </a>
      `).join('');

      document.getElementById('ref-verification-box').innerHTML = `
        <div>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 mb-2">
            ${escapeHTML(ui.sopPill)}
          </span>
          <h3 class="text-lg sm:text-xl font-extrabold text-slate-900">${escapeHTML(ui.sopTitle)}</h3>
          <p class="text-sm text-slate-600 mt-1">${escapeHTML(ui.sopDesc)}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${VERIFICATION_STEPS.map(step => `
            <div class="bg-[#F8FAFC] rounded-2xl border border-slate-200/80 p-4 space-y-2">
              <div class="flex items-center gap-2.5">
                <span class="w-7 h-7 rounded-lg ${step.color} text-white text-xs font-extrabold flex items-center justify-center shrink-0">${step.num}</span>
                <h4 class="text-sm font-bold text-slate-900">${escapeHTML(step.title[lang])}</h4>
              </div>
              <div class="text-xs text-slate-600 leading-relaxed">${step.body[lang]}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    /**
     * =========================================================================
     * 15. MASTER RENDERER & INITIALIZATION
     * =========================================================================
     */
    function renderAll() {
      renderChrome();
      if (state.activeTab === 'catalog') renderCatalog();
      if (state.activeTab === 'finder') renderWizard();
      if (state.activeTab === 'claim') renderClaimTab();
      if (state.activeTab === 'scripts') renderScriptsTab();
      if (state.activeTab === 'references') renderReferencesTab();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.documentElement.lang = state.lang;

      // Catalog search listener
      const searchInput = document.getElementById('catalog-search');
      const clearBtn = document.getElementById('catalog-clear-search');
      searchInput.addEventListener('input', (e) => {
        state.catalogSearch = e.target.value;
        clearBtn.classList.toggle('hidden', !state.catalogSearch.trim());
        renderCatalog();
      });

      // Personalization inputs for Tab 4
      const bindTpl = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('input', (e) => {
          state.tpl[key] = e.target.value;
          renderScriptsTab();
        });
      };
      bindTpl('tpl-client-name', 'clientName');
      bindTpl('tpl-topic', 'topic');
      bindTpl('tpl-ae-name', 'aeName');
      bindTpl('tpl-partner-name', 'partnerName');

      // ESC key closes modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeProgramModal();
      });

      renderAll();
    });
  </script>
</body>
</html>
